name: Generate & Deploy CI Report

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare config
        run: |
          # Use real company.yaml if available as a secret, otherwise fall back to example
          if [ -n "${{ secrets.COMPANY_YAML }}" ]; then
            echo "${{ secrets.COMPANY_YAML }}" > company.yaml
          else
            cp company.example.yaml company.yaml
          fi

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Running live pipeline with Claude Opus 4.6..."
            python main.py --run-now --skip-firehose --skip-firecrawl --news-days 1
          else
            echo "No API key found — running demo mode..."
            python seed_demo.py
            python run_demo.py
          fi

      - name: Build index page
        run: |
          python - <<'EOF'
          import os, re
          from pathlib import Path
          from datetime import datetime

          reports_dir = Path("reports")
          html_files = sorted(reports_dir.glob("competitive_intel_*.html"), reverse=True)
          digest_files = sorted(reports_dir.glob("daily_digest_*.md"), reverse=True)

          rows = ""
          for f in html_files:
              date = re.search(r"(\d{4}-\d{2}-\d{2})", f.name)
              label = date.group(1) if date else f.name
              rows += f'<tr><td><a href="{f.name}">{label} HTML Report</a></td><td>Full competitive intelligence report</td></tr>\n'
          for f in digest_files:
              date = re.search(r"(\d{4}-\d{2}-\d{2})", f.name)
              label = date.group(1) if date else f.name
              rows += f'<tr><td><a href="{f.name}">{label} Daily Digest</a></td><td>Markdown digest (CI team)</td></tr>\n'

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Competitive Intelligence Reports</title>
          <style>
            body {{ font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                   max-width: 860px; margin: 3rem auto; padding: 0 1rem; color: #212529; }}
            h1 {{ color: #003DA5; border-bottom: 2px solid #E8EFF9; padding-bottom: .5rem; }}
            p  {{ color: #6c757d; margin: .5rem 0 1.5rem; }}
            table {{ width: 100%; border-collapse: collapse; }}
            th {{ background: #E8EFF9; padding: .6rem .8rem; text-align: left; }}
            td {{ padding: .6rem .8rem; border-bottom: 1px solid #dee2e6; }}
            a  {{ color: #003DA5; text-decoration: none; }}
            a:hover {{ text-decoration: underline; }}
            footer {{ margin-top: 2rem; text-align: center; font-size: .8rem; color: #adb5bd; }}
          </style>
          </head>
          <body>
          <h1>Competitive Intelligence Reports</h1>
          <p>Generated daily at 06:00 UTC by Claude Opus 4.6 · Updated {datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")}</p>
          <table>
            <thead><tr><th>Report</th><th>Description</th></tr></thead>
            <tbody>{rows}</tbody>
          </table>
          <footer>Powered by Claude Opus 4.6 + Ahrefs Firehose</footer>
          </body>
          </html>"""

          Path("reports/index.html").write_text(html)
          print("index.html written")
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          commit_message: "Deploy CI report ${{ github.run_number }}"
